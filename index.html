<html lang="en" data-theme="cozy">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Break 🐾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --linen: #EBE1D2;
    --card: #FFFBF3;
    --coffee: #4A3F35;
    --sage: #7C8A6B;
    --rose: #C98F8F;
    --honey: #C99A44;
    --shadow: #D9CBB4;
    --muted: #8a7c6a;
    --btn-primary-shadow: #a86d6d;
    --btn-secondary-active-shadow: #5f6b51;
    --grad-a: rgba(201,143,143,0.12);
    --grad-b: rgba(124,138,107,0.14);
    --grid-line: rgba(74, 63, 53, 0.04);
  }

  [data-theme="dark"]{
    --linen: #241F26;
    --card: #2E2831;
    --coffee: #F1E7DA;
    --sage: #8FA37D;
    --rose: #D99BA0;
    --honey: #D9A85B;
    --shadow: #17131A;
    --muted: #b6a99c;
    --btn-primary-shadow: #7d4a4f;
    --btn-secondary-active-shadow: #3d4a34;
    --grad-a: rgba(217,155,160,0.10);
    --grad-b: rgba(143,163,125,0.12);
    --grid-line: rgba(241, 231, 218, 0.03);
  }

  [data-theme="lavender"]{
    --linen: #EDE7F6;
    --card: #FBF9FF;
    --coffee: #453E52;
    --sage: #9686B8;
    --rose: #C9A8D9;
    --honey: #B39DDB;
    --shadow: #D8CCEC;
    --muted: #8b7fa3;
    --btn-primary-shadow: #9678a8;
    --btn-secondary-active-shadow: #7d6a99;
    --grad-a: rgba(201,168,217,0.14);
    --grad-b: rgba(150,134,184,0.14);
    --grid-line: rgba(69, 62, 82, 0.04);
  }

  [data-theme="matcha"]{
    --linen: #E7EEE1;
    --card: #FAFBF6;
    --coffee: #3E4A3A;
    --sage: #8CA37C;
    --rose: #C7B27E;
    --honey: #A9B96B;
    --shadow: #D3E0C8;
    --muted: #7c8a72;
    --btn-primary-shadow: #8a9968;
    --btn-secondary-active-shadow: #6d8060;
    --grid-line: rgba(62, 74, 58, 0.04);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: var(--linen);
    background-image:
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.15) 12px, transparent 12px),
      linear-gradient(rgba(255, 255, 255, 0.15) 12px, transparent 12px),
      radial-gradient(ellipse at 15% 10%, var(--grad-a), transparent 45%),
      radial-gradient(ellipse at 85% 90%, var(--grad-b), transparent 50%);
    background-size: 24px 24px, 24px 24px, 48px 48px, 48px 48px, 100% 100%, 100% 100%;
    font-family: 'Karla', sans-serif;
    color: var(--coffee);
    overflow-x: hidden;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  .paws{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .paw{
    position: absolute;
    font-size: 28px;
    opacity: 0.10;
    animation: drift linear infinite;
    color: var(--sage);
  }
  @keyframes drift{
    from{ transform: translateY(110vh) rotate(0deg); }
    to{ transform: translateY(-10vh) rotate(40deg); }
  }

  .wrap{
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .top-row{
    width: 100%;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 8px;
  }
  .icon-btn{
    background: var(--card);
    color: var(--coffee);
    border: none;
    border-radius: 999px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.4s ease;
  }
  .icon-btn:hover{ transform: translateY(-2px); }
  .icon-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
  .icon-btn.active{ background: var(--sage); color: var(--card); }

  h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(2.2rem, 7vw, 3.2rem);
    margin: 0 0 4px;
    color: var(--coffee);
    letter-spacing: -0.5px;
  }
  h1 .hi{
    display: inline-block;
    font-style: normal;
    color: var(--rose);
  }

  .subtitle{
    font-size: 1.02rem;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 32px;
    letter-spacing: 0.2px;
  }

  .stage{
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    max-height: 480px;
    border-radius: 28px;
    background: linear-gradient(135deg, var(--sage), var(--honey));
    padding: 10px;
    box-shadow: 0 16px 0 var(--shadow), 0 22px 38px rgba(0,0,0,0.18);
    transition: background 0.4s ease;
  }
  .frame{
    width: 100%;
    height: 100%;
    border-radius: 20px;
    overflow: hidden;
    background: var(--card);
    position: relative;
    transition: background-color 0.4s ease;
  }

  .layer{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .layer.visible{ opacity: 1; z-index: 2; }
  .layer img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(0.92) brightness(1.02);
  }

  .fade-in {
    animation: fadeIn 0.5s ease-in forwards;
  }
  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  .loading-cat{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%, 100%{ transform: scale(1); opacity: 0.85; }
    50%{ transform: scale(1.035); opacity: 1; }
  }
  .loading-cat svg{ width: 130px; height: auto; display: block; }
  .loading-label{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--muted);
  }
  .zzz{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    fill: var(--honey);
    animation: floatz 2.6s ease-in-out infinite;
    opacity: 0;
  }
  .zzz.z1{ animation-delay: 0s; }
  .zzz.z2{ animation-delay: 0.4s; }
  .zzz.z3{ animation-delay: 0.8s; }
  @keyframes floatz{
    0%{ opacity: 0; transform: translate(0,0); }
    20%{ opacity: 0.9; }
    80%{ opacity: 0.4; }
    100%{ opacity: 0; transform: translate(6px,-14px); }
  }

  .controls{
    margin-top: 28px;
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  button{
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 0.98rem;
    border: none;
    cursor: pointer;
    border-radius: 999px;
    padding: 14px 26px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.4s ease, color 0.4s ease;
  }
  button:active{ transform: translateY(3px); }

  .btn-primary{
    background: var(--rose);
    color: var(--card);
    box-shadow: 0 5px 0 var(--btn-primary-shadow);
  }
  .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 7px 0 var(--btn-primary-shadow); }
  .btn-primary:active{ box-shadow: 0 2px 0 var(--btn-primary-shadow); transform: translateY(3px); }

  .btn-secondary{
    background: var(--card);
    color: var(--coffee);
    box-shadow: 0 5px 0 var(--shadow);
  }
  .btn-secondary:hover{ transform: translateY(-2px); box-shadow: 0 7px 0 var(--shadow); }
  .btn-secondary.active{
    background: var(--sage);
    color: var(--card);
    box-shadow: 0 5px 0 var(--btn-secondary-active-shadow);
  }

  .quote{
    margin-top: 36px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 1.2rem;
    font-weight: 500;
    color: var(--coffee);
    max-width: 420px;
    line-height: 1.4;
    min-height: 2.8em;
  }
  .quote::before{ content: "“"; color: var(--rose); }
  .quote::after{ content: "”"; color: var(--rose); }

  footer{
    margin-top: 40px;
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
  }

  @media (prefers-reduced-motion: reduce){
    .paw{ animation: none; display: none; }
    .loading-cat, .zzz{ animation: none; }
    .layer{ transition: none; }
    .fade-in{ animation: none; }
  }
</style>
</head>
<body>

<div class="paws" id="paws"></div>

<div class="wrap">
  <div class="top-row">
    <button class="icon-btn" id="soundBtn" title="Ambient sound: off">🧶</button>
    <button class="icon-btn" id="themeBtn" title="Change theme">🎨</button>
  </div>

  <h1>Cat Break <span class="hi">🐾</span></h1>
  <p class="subtitle">a small, soft place to look at cats for a minute</p>

  <div class="stage">
    <div class="frame" id="frame">
      <div class="layer visible" id="layerA"></div>
      <div class="layer" id="layerB"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-primary" id="nextBtn">🐱 Next cat</button>
    <button class="btn-secondary" id="autoBtn">▶ Auto-play</button>
  </div>

  <p class="quote" id="quote">breathe in, breathe out, look at the cat</p>

  <footer>refreshes from a public cat gif service · take your time 🐾</footer>
</div>

<script>
  /* ---------- ambient paw prints ---------- */
  const pawsContainer = document.getElementById('paws');
  for(let i=0;i<10;i++){
    const p = document.createElement('div');
    p.className = 'paw';
    p.textContent = '🐾';
    p.style.left = Math.random()*100 + 'vw';
    p.style.animationDuration = (14 + Math.random()*10) + 's';
    p.style.animationDelay = (Math.random()*14) + 's';
    p.style.fontSize = (18 + Math.random()*22) + 'px';
    pawsContainer.appendChild(p);
  }

  const quotes = [
    "breathe in, breathe out, look at the cat",
    "nothing bad has ever happened while watching a cat",
    "this is your scheduled softness",
    "the cat does not know your deadlines, and neither should you right now",
    "small pause, small paws",
    "you are allowed to do nothing for a moment",
    "the cat is doing great, and so are you",
    "a little chaos, a little comfort"
  ];

  const layerA = document.getElementById('layerA');
  const layerB = document.getElementById('layerB');
  const quoteEl = document.getElementById('quote');
  const nextBtn = document.getElementById('nextBtn');
  const autoBtn = document.getElementById('autoBtn');
  const themeBtn = document.getElementById('themeBtn');
  const soundBtn = document.getElementById('soundBtn');

  let frontLayer = layerA;
  let backLayer = layerB;
  let autoTimer = null;
  let autoOn = false;
  let nextReady = null;

  const SLEEPING_CAT_SVG = `
    <div class="loading-cat">
      <svg viewBox="0 0 160 110" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="80" cy="88" rx="58" ry="10" fill="#D9CBB4" opacity="0.4"/>
        <path d="M25 70 C15 45, 35 20, 65 22 C60 12, 72 6, 80 12 C88 6, 100 12, 95 22 C125 20, 145 45, 135 70 C145 78, 140 92, 125 92 L35 92 C20 92, 15 78, 25 70 Z" fill="#C99A44" opacity="0.9"/>
        <path d="M45 26 L38 8 L58 24 Z" fill="#C99A44"/>
        <path d="M115 26 L122 8 L102 24 Z" fill="#C99A44"/>
        <path d="M45 26 L41 14 L54 23 Z" fill="#C98F8F"/>
        <path d="M115 26 L119 14 L106 23 Z" fill="#C98F8F"/>
        <path d="M52 55 Q60 50 68 55" stroke="#4A3F35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M92 55 Q100 50 108 55" stroke="#4A3F35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M76 62 Q80 66 84 62" stroke="#4A3F35" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M125 60 C142 58, 150 72, 138 82 C130 88, 118 84, 118 74 Z" fill="#C99A44" opacity="0.9"/>
        <text x="118" y="30" class="zzz z1" font-size="14">z</text>
        <text x="126" y="20" class="zzz z2" font-size="18">z</text>
        <text x="136" y="8" class="zzz z3" font-size="22">z</text>
      </svg>
      <div class="loading-label">tucking in a cat…</div>
    </div>`;

  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
    ]);
  }

  function preloadImg(url){
    return withTimeout(new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('failed to load'));
      img.src = url;
      img.alt = 'A random cat';
    }), 4000);
  }

  async function fetchCatImage() {
    const wantsGif = Math.random() < 0.5;
    const timestamp = Date.now() + '_' + Math.floor(Math.random() * 1000);

    if (wantsGif) {
      try {
        return await preloadImg(`https://cataas.com/cat/gif?t=${timestamp}`);
      } catch (e) {}

      try {
        const res = await withTimeout(
          fetch('https://api.thecatapi.com/v1/images/search?mime_types=gif&limit=1&t=' + timestamp),
          3500
        );
        const data = await res.json();
        if (data && data[0] && data[0].url) {
          return await preloadImg(data[0].url);
        }
      } catch (e) {}
    } else {
      try {
        const res = await withTimeout(
          fetch('https://api.thecatapi.com/v1/images/search?mime_types=jpg,png&limit=1&t=' + timestamp),
          3500
        );
        const data = await res.json();
        if (data && data[0] && data[0].url) {
          return await preloadImg(data[0].url);
        }
      } catch (e) {}

      try {
        return await preloadImg(`https://cataas.com/cat?t=${timestamp}`);
      } catch (e) {}
    }

    try {
      const backupPool = [
        'https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif',
        'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=700&auto=format&fit=crop',
        'https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif',
        'https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=700&auto=format&fit=crop'
      ];
      return await preloadImg(backupPool[Math.floor(Math.random() * backupPool.length)]);
    } catch (e) {
      return null;
    }
  }

  function prefetchNext(){
    nextReady = fetchCatImage();
  }

  async function showNextCat(){
    quoteEl.textContent = quotes[Math.floor(Math.random()*quotes.length)];

    let imgPromise = nextReady || fetchCatImage();
    nextReady = null;

    const loaderTimer = setTimeout(() => {
      backLayer.innerHTML = SLEEPING_CAT_SVG;
      backLayer.classList.add('visible');
      frontLayer.classList.remove('visible');
      [frontLayer, backLayer] = [backLayer, frontLayer];
    }, 250);

    const img = await imgPromise;
    clearTimeout(loaderTimer);

    if(!img){
      frontLayer.innerHTML = SLEEPING_CAT_SVG.replace('tucking in a cat…', 'cats are napping — try again soon');
      frontLayer.classList.add('visible');
      backLayer.classList.remove('visible');
      prefetchNext();
      return;
    }

    img.classList.add('fade-in');
    backLayer.innerHTML = '';
    backLayer.appendChild(img);
    backLayer.classList.add('visible');
    frontLayer.classList.remove('visible');
    [frontLayer, backLayer] = [backLayer, frontLayer];

    prefetchNext();
  }

  function toggleAuto(){
    autoOn = !autoOn;
    if(autoOn){
      autoBtn.textContent = '⏸ Pause';
      autoBtn.classList.add('active');
      autoTimer = setInterval(showNextCat, 6000);
    } else {
      autoBtn.textContent = '▶ Auto-play';
      autoBtn.classList.remove('active');
      clearInterval(autoTimer);
    }
  }

  nextBtn.addEventListener('click', showNextCat);
  autoBtn.addEventListener('click', toggleAuto);

  /* ---------- Theme Switcher ---------- */
  const themes = [
    { key: 'cozy',     icon: '🎨', label: 'Cozy linen' },
    { key: 'dark',     icon: '🌙', label: 'Dark cozy' },
    { key: 'lavender', icon: '💜', label: 'Soft lavender' },
    { key: 'matcha',   icon: '🍵', label: 'Soft matcha' }
  ];
  let themeIndex = 0;
  themeBtn.addEventListener('click', () => {
    themeIndex = (themeIndex + 1) % themes.length;
    const t = themes[themeIndex];
    document.documentElement.setAttribute('data-theme', t.key);
    themeBtn.textContent = t.icon;
    themeBtn.title = t.label;
  });

  /* ---------- Ambient Audio (Melodies) ---------- */
  let audioCtx = null;
  let currentSound = null;
  const soundModes = ['off', 'smellyCat', 'jingleBells', 'merryChristmas', 'silentNight'];
  let soundIndex = 0;

  function ensureAudioCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  const N = {
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, Fs4: 369.99, G4: 392.00, A4: 440.00, B4: 493.88,
    C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77, C6: 1046.50
  };

  function playMelodyLoop(ctx, melody, waveType, gainMax, tempoMs, filterFreq) {
    let isPlaying = true;
    let step = 0;
    let timer = null;

    function playNext() {
      if (!isPlaying) return;
      const item = melody[step];
      if (item && item.freq) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = waveType;
        osc.frequency.setValueAtTime(item.freq, ctx.currentTime);

        let filter = null;
        if (filterFreq) {
          filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = filterFreq;
        }

        const dur = (item.dur || 1) * (tempoMs / 1000);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(gainMax, ctx.currentTime + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur * 1.8);

        if (filter) {
          osc.connect(filter);
          filter.connect(gain);
        } else {
          osc.connect(gain);
        }
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + dur * 1.9);
      }

      const stepDelay = (item && item.dur ? item.dur : 1) * tempoMs;
      step = (step + 1) % melody.length;
      timer = setTimeout(playNext, stepDelay);
    }

    playNext();
    return {
      stop() {
        isPlaying = false;
        clearTimeout(timer);
      }
    };
  }

  function startSmellyCat(ctx) {
    const melody = [
      { freq: N.E4, dur: 1 }, { freq: N.G4, dur: 1 }, { freq: N.A4, dur: 1.5 },
      { freq: N.G4, dur: 1 }, { freq: N.E4, dur: 2 },
      { freq: null, dur: 1 },
      { freq: N.E4, dur: 1 }, { freq: N.G4, dur: 1 }, { freq: N.A4, dur: 1.5 },
      { freq: N.G4, dur: 1 }, { freq: N.E4, dur: 2.5 },
      { freq: null, dur: 2 }
    ];
    return playMelodyLoop(ctx, melody, 'triangle', 0.08, 420, 750);
  }

  function startJingleBells(ctx) {
    const melody = [
      { freq: N.E5, dur: 1 }, { freq: N.E5, dur: 1 }, { freq: N.E5, dur: 2 },
      { freq: N.E5, dur: 1 }, { freq: N.E5, dur: 1 }, { freq: N.E5, dur: 2 },
      { freq: N.E5, dur: 1 }, { freq: N.G5, dur: 1 }, { freq: N.C5, dur: 1.5 }, { freq: N.D5, dur: 0.5 },
      { freq: N.E5, dur: 3 },
      { freq: null, dur: 2 }
    ];
    return playMelodyLoop(ctx, melody, 'sine', 0.07, 360);
  }

  function startMerryChristmas(ctx) {
    const melody = [
      { freq: N.D4, dur: 1 },
      { freq: N.G4, dur: 1 }, { freq: N.G4, dur: 0.5 }, { freq: N.A4, dur: 0.5 }, { freq: N.G4, dur: 0.5 }, { freq: N.Fs4, dur: 0.5 },
      { freq: N.E4, dur: 1 }, { freq: N.E4, dur: 1 }, { freq: N.E4, dur: 1 },
      { freq: N.A4, dur: 1 }, { freq: N.A4, dur: 0.5 }, { freq: N.B4, dur: 0.5 }, { freq: N.A4, dur: 0.5 }, { freq: N.G4, dur: 0.5 },
      { freq: N.Fs4, dur: 1 }, { freq: N.D4, dur: 1 }, { freq: N.D4, dur: 1 },
      { freq: null, dur: 2 }
    ];
    return playMelodyLoop(ctx, melody, 'sine', 0.06, 380);
  }

  function startSilentNight(ctx) {
    const melody = [
      { freq: N.G4, dur: 1.5 }, { freq: N.A4, dur: 0.5 }, { freq: N.G4, dur: 1 },
      { freq: N.E4, dur: 3 },
      { freq: N.G4, dur: 1.5 }, { freq: N.A4, dur: 0.5 }, { freq: N.G4, dur: 1 },
      { freq: N.E4, dur: 3 },
      { freq: N.D5, dur: 2 }, { freq: N.D5, dur: 1 },
      { freq: N.B4, dur: 3 },
      { freq: N.C5, dur: 2 }, { freq: N.C5, dur: 1 },
      { freq: N.G4, dur: 3 },
      { freq: null, dur: 2.5 }
    ];
    return playMelodyLoop(ctx, melody, 'sine', 0.065, 480);
  }

  const soundIcons = { 
    off: '🧶', 
    smellyCat: '🐾', 
    jingleBells: '❄️', 
    merryChristmas: '🌾', 
    silentNight: '🌸' 
  };

  const soundTitles = { 
    off: 'Ambient sound: off', 
    smellyCat: 'Ambient sound: Smelly Cat (Lullaby)', 
    jingleBells: 'Ambient sound: Jingle Bells (Music Box)', 
    merryChristmas: 'Ambient sound: Merry Christmas (Celesta)', 
    silentNight: 'Ambient sound: Silent Night (Dreamy)' 
  };

  soundBtn.addEventListener('click', () => {
    if(currentSound){ currentSound.stop(); currentSound = null; }
    soundIndex = (soundIndex + 1) % soundModes.length;
    const mode = soundModes[soundIndex];
    soundBtn.textContent = soundIcons[mode];
    soundBtn.title = soundTitles[mode];
    soundBtn.classList.toggle('active', mode !== 'off');

    if(mode === 'off') return;
    const ctx = ensureAudioCtx();
    if(ctx.state === 'suspended') ctx.resume();

    if(mode === 'smellyCat') currentSound = startSmellyCat(ctx);
    else if(mode === 'jingleBells') currentSound = startJingleBells(ctx);
    else if(mode === 'merryChristmas') currentSound = startMerryChristmas(ctx);
    else if(mode === 'silentNight') currentSound = startSilentNight(ctx);
  });

  /* ---------- initial load ---------- */
  showNextCat();
</script>

</body>
</html>
